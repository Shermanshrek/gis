spring:
  application:
    name: gis-back
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gis}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

# JWT. Секрет обязателен — задавайте через переменную окружения JWT_SECRET
# (Base64-строка, декодируется в ключ не короче 32 байт для HS256).
jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}      # 15 минут
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 дней

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    ru.gisback: DEBUG
